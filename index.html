<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css">
  <script type="module" src="./scripts/main.js"></script>
  <title>Windbnb - Stays</title>
</head>

<body class="bg-white font-sans text-[#333333] antialiased">

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <header class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-6 mb-12">
      <div class="flex items-center">
        <img src="./images/icons/logo-f7862584.svg" alt="Windbnb logo" class="h-6">
      </div>

      <div id="bar-busqueda-trigger"
        class="flex items-center divide-x divide-gray-100 rounded-2xl shadow-md border border-gray-50 text-sm h-14 cursor-pointer hover:shadow-lg transition-shadow bg-white self-center sm:self-auto">
        <div class="px-4 py-2 text-gray-300 font-normal" id="txt-location-bar">Add location</div>
        <div class="px-4 py-2 text-gray-300 font-normal" id="txt-guests-bar">Add guests</div>
        <div class="px-4 flex items-center justify-center text-[#eb5757]">
          <img src="./images/icons/search.svg" alt="Search" class="w-4 h-4">
        </div>
      </div>
    </header>

    <main>
      <div class="flex justify-between items-center mb-8">
        <h1 id="titulo-stays" class="text-2xl font-bold text-[#333333]">Stays in Finland</h1>
        <span id="contador-stays" class="text-sm font-medium text-[#4f4f4f]">0 stays</span>
      </div>

      <div id="grid-stays" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-12"></div>
    </main>
  </div>

  <div id="modal-busqueda" class="fixed inset-0 z-50 invisible opacity-0 transition-all duration-300">

    <div id="modal-overlay" class="absolute inset-0 bg-black/40"></div>

    <div
      class="absolute top-0 inset-x-0 bg-white px-4 sm:px-12 py-8 shadow-xl flex flex-col gap-8 max-h-[90vh] overflow-y-auto">

      <div
        class="grid grid-cols-1 md:grid-cols-3 border border-gray-100 shadow-md rounded-2xl text-xs overflow-hidden divide-y md:divide-y-0 md:divide-x divide-gray-100">

        <div class="p-3 cursor-pointer hover:bg-gray-50 transition-colors flex flex-col justify-center h-16"
          id="btn-input-location">
          <label class="font-extrabold uppercase text-[9px] text-[#333333] tracking-wider mb-0.5">Location</label>
          <input type="text" id="input-location" placeholder="Add location" autocomplete="off"
            class="bg-transparent font-medium text-sm text-[#333333] outline-none placeholder-gray-400 w-full">
        </div>

        <div class="p-3 cursor-pointer hover:bg-gray-50 transition-colors flex flex-col justify-center h-16"
          id="btn-input-guests">
          <label class="font-extrabold uppercase text-[9px] text-[#333333] tracking-wider mb-0.5">Guests</label>
          <span id="txt-guests-count" class="font-medium text-sm text-gray-400">Add guests</span>
        </div>

        <div class="p-3 flex items-center justify-center">
          <button id="btn-search-submit"
            class="w-full bg-[#eb5757] hover:bg-[#d64b4b] text-white font-bold text-sm px-7 py-3.5 rounded-2xl flex items-center justify-center gap-2.5 transition-colors shadow-sm">
            <img src="./images/icons/search.svg" alt="" class="w-4 h-4 brightness-0 invert"> Search
          </button>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-sm min-h-40">

        <div id="panel-location" class="flex flex-col gap-5 pl-3 md:col-start-1">
          <button
            class="option-city flex items-center gap-3 text-[#4f4f4f] hover:text-[#333333] font-medium transition-colors text-left"
            data-city="Helsinki">
            <svg class="w-4 h-5 text-gray-400 shrink-0" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd"
                d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z"
                clip-rule="evenodd" />
            </svg>
            Helsinki, Finland
          </button>
          <button
            class="option-city flex items-center gap-3 text-[#4f4f4f] hover:text-[#333333] font-medium transition-colors text-left"
            data-city="Turku">
            <svg class="w-4 h-5 text-gray-400 shrink-0" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd"
                d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z"
                clip-rule="evenodd" />
            </svg>
            Turku, Finland
          </button>
          <button
            class="option-city flex items-center gap-3 text-[#4f4f4f] hover:text-[#333333] font-medium transition-colors text-left"
            data-city="Vaasa">
            <svg class="w-4 h-5 text-gray-400 shrink-0" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd"
                d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z"
                clip-rule="evenodd" />
            </svg>
            Vaasa, Finland
          </button>
          <button
            class="option-city flex items-center gap-3 text-[#4f4f4f] hover:text-[#333333] font-medium transition-colors text-left"
            data-city="Oulu">
            <svg class="w-4 h-5 text-gray-400 shrink-0" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd"
                d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z"
                clip-rule="evenodd" />
            </svg>
            Oulu, Finland
          </button>
        </div>

        <div id="panel-guests" class="hidden flex-col gap-8 pl-3 md:col-start-2">
          <div class="flex flex-col gap-1">
            <h4 class="font-bold text-[#333333] text-sm">Adults</h4>
            <p class="text-xs text-gray-400 font-normal mb-2">Ages 13 or above</p>
            <div class="flex items-center gap-4 text-[#333333]">
              <button id="btn-adults-minus"
                class="w-6 h-6 rounded-md border border-gray-400 flex items-center justify-center hover:border-black font-semibold cursor-pointer select-none">-</button>
              <span id="lbl-adults" class="font-bold w-4 text-center">0</span>
              <button id="btn-adults-plus"
                class="w-6 h-6 rounded-md border border-gray-400 flex items-center justify-center hover:border-black font-semibold cursor-pointer select-none">+</button>
            </div>
          </div>

          <div class="flex flex-col gap-1">
            <h4 class="font-bold text-[#333333] text-sm">Children</h4>
            <p class="text-xs text-gray-400 font-normal mb-2">Ages 2-12</p>
            <div class="flex items-center gap-4 text-[#333333]">
              <button id="btn-kids-minus"
                class="w-6 h-6 rounded-md border border-gray-400 flex items-center justify-center hover:border-black font-semibold cursor-pointer select-none">-</button>
              <span id="lbl-kids" class="font-bold w-4 text-center">0</span>
              <button id="btn-kids-plus"
                class="w-6 h-6 rounded-md border border-gray-400 flex items-center justify-center hover:border-black font-semibold cursor-pointer select-none">+</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</body>

</html>
